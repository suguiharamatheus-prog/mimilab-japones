    "hint": "Expressão usada quando alguém está doente.",
    "url": "https://upload.wikimedia.org/wikipedia/commons/8/83/LL-Q5287_(jpn)-Fukujinzuke-%E3%81%8A%E5%A4%A7%E4%BA%8B%E3%81%AB.wav",
    "source": "https://commons.wikimedia.org/wiki/File:LL-Q5287_(jpn)-Fukujinzuke-%E3%81%8A%E5%A4%A7%E4%BA%8B%E3%81%AB.wav"
  },
  {
    "id": "okaneo",
    "text": "お金をおろします",
    "kana": "おかねをおろします",
    "pt": "vou sacar dinheiro",
    "cat": "frases",
    "hint": "Ouça a expressão completa.",
    "url": "https://upload.wikimedia.org/wikipedia/commons/8/81/LL-Q5287_(jpn)-Fukujinzuke-%E3%81%8A%E9%87%91%E3%82%92%E3%81%8A%E3%82%8D%E3%81%97%E3%81%BE%E3%81%99.wav",
    "source": "https://commons.wikimedia.org/wiki/File:LL-Q5287_(jpn)-Fukujinzuke-%E3%81%8A%E9%87%91%E3%82%92%E3%81%8A%E3%82%8D%E3%81%97%E3%81%BE%E3%81%99.wav"
  }
];
const CATS={longas:{label:'Vogais longas',icon:'〜',description:'Ouça a duração das vogais (おとうさん, おねえさん).'},sokuon:{label:'Pequeno っ',icon:'っ',description:'Perceba a pequena pausa antes de consoantes.'},vogais:{label:'Sons parecidos',icon:'あ',description:'Diferencie vogais e sílabas próximas.'},palavras:{label:'Palavras do dia a dia',icon:'言',description:'Reconheça palavras comuns do japonês.'},frases:{label:'Expressões',icon:'文',description:'Ouça falas curtas e úteis.'}};
const STORAGE='mimilab-2026-v1';
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const el=$('#app');
let page='home', selectedCat='todos', session=null, currentAudio=null, audioStatus='', timer=null, filteredSearch='';
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||{total:0,correct:0,attempts:[],cat:{},bestSprint:0,settings:{}}}catch{return {total:0,correct:0,attempts:[],cat:{},bestSprint:0,settings:{}}}}
let db=load();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopAudio(){if(currentAudio){currentAudio.pause();currentAudio.removeAttribute('src');currentAudio.load();currentAudio=null}}
function setStatus(s,isError=false){audioStatus=s;const node=$('#audioState');if(node){node.textContent=s;node.style.color=isError?'#fa91a4':'#eec787'}}
function playWord(id){const w=WORDS.find(w=>w.id===id);if(!w)return;stopAudio();const audio=new Audio();currentAudio=audio;audio.preload='auto';audio.src=w.url;setStatus('Carregando gravação…');audio.onplaying=()=>{if(currentAudio===audio)setStatus('Reproduzindo gravação humana ✓')};audio.onended=()=>{if(currentAudio===audio)setStatus('Toque para ouvir novamente')};audio.onerror=()=>{if(currentAudio===audio)setStatus('Áudio não carregou. Confira a internet e teste novamente.',true)};audio.play().catch(()=>setStatus('O iPhone bloqueou a reprodução. Toque novamente em ▶.',true));}
function applyNav(p){$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===p));}
function go(p){if(timer){clearInterval(timer);timer=null}stopAudio();session=null;page=p;applyNav(p);render();window.scrollTo({top:0,behavior:'instant'})}
function labels(){return Object.entries(CATS).map(([k,c])=>`<button class="toggle ${selectedCat===k?'active':''}" type="button" data-cat="${k}">${c.icon} ${c.label}</button>`).join('')}
function home(){return `<section class="view"><div class="intro"><div class="eyebrow">耳を育てる • treine seu ouvido</div><h1 class="big">Japonês começa<br>pelo <span style="color:var(--mint)">ouvido.</span></h1><p class="muted">Treine a percepção dos sons japoneses com gravações humanas. Sem voz artificial ou correção durante o teste.</p></div>
<div class="card featured"><div class="eyebrow">Seu treino de hoje</div><h2>Desafio de escuta</h2><p style="font-size:13px;color:#a9c5cb">12 perguntas • áudio primeiro • resultado no final</p><div class="pills"><span class="pill">Vogais longas</span><span class="pill">Pequeno っ</span><span class="pill">Sons parecidos</span></div><div class="divider"></div><button class="btn" data-action="start-all">▶ &nbsp; Começar avaliação</button></div>
<div class="sectionbar"><h2>Escolha um modo</h2><span class="mini">Sem assinatura</span></div><div class="subgrid"><button class="card cardlink" data-action="sprint-info"><span class="icon" style="color:var(--warn)">◴</span><h3>Sprint • 60 segundos</h3><p>Quantas palavras você reconhece?</p></button><button class="card cardlink" data-navto="treino"><span class="icon" style="color:var(--indigo)">◎</span><h3>Treinar por som</h3><p>Estude apenas o que precisa.</p></button></div>
<div class="sectionbar"><h2>Seu progresso</h2><button type="button" class="inlinebtn mini" data-navto="progresso">Ver tudo →</button></div><div class="card"><div class="start"><div><span class="mini">Respostas acumuladas</span><div style="font-size:30px;font-weight:800">${db.total}</div></div><div style="text-align:right"><span class="mini">Precisão geral</span><div style="font-size:30px;font-weight:800;color:var(--mint)">${db.total?Math.round(db.correct/db.total*100):'—'}${db.total?'%':''}</div></div></div></div>
<div class="info"><span class="icon">ⓘ</span><span>Os arquivos de áudio vêm do Wikimedia Commons e precisam de internet. Esta primeira versão ainda não analisa o tom da sua voz.</span></div></section>`}
function training(){const count=k=>WORDS.filter(w=>w.cat===k).length;return `<section class="view"><div class="eyebrow">Treinamento focado</div><h1 class="big">Qual som quer<br>praticar?</h1><p class="muted" style="font-size:14px">Escolha uma categoria. A resposta só aparece depois de concluir todas as perguntas.</p><div class="card" style="padding:16px"><div class="togglewrap"><button class="toggle ${selectedCat==='todos'?'active':''}" data-cat="todos">✦ Todos</button>${labels()}</div><p class="mini">${selectedCat==='todos'?`${WORDS.length} gravações disponíveis`:`${count(selectedCat)} gravações nesta categoria`}</p><button class="btn" data-action="start-selected">▶ &nbsp; Iniciar treino</button></div><div class="sectionbar"><h2>Os cinco módulos</h2></div>${Object.entries(CATS).map(([k,c])=>`<button class="card cardlink" style="display:flex;align-items:center;gap:15px" type="button" data-start-cat="${k}"><div style="width:52px;height:52px;min-width:52px;background:#203b42;border-radius:17px;display:grid;place-items:center;color:var(--mint);font-size:26px">${c.icon}</div><div><b>${c.label}</b><div class="mini" style="margin:4px 0">${c.description}</div><span class="mini">${count(k)} áudios · iniciar →</span></div></button>`).join('')}</section>`}
function optionsFor(w,pool){let candidates=pool.filter(x=>x.id!==w.id);candidates=shuffle(candidates);const n=Math.min(4,pool.length);if(candidates.length<n-1){candidates=shuffle(WORDS.filter(x=>x.id!==w.id))}return shuffle([w,...candidates.slice(0,n-1)]).map(x=>({id:x.id,text:x.text}))}
function begin(mode,cat='todos'){let pool=cat==='todos'?WORDS:WORDS.filter(w=>w.cat===cat);if(pool.length<2){setStatus('Não há palavras suficientes para esse módulo.',true);return}if(timer)clearInterval(timer);stopAudio();const order=shuffle(pool);let queue=mode==='sprint'?[order[0]]:order.slice(0,Math.min(mode==='quiz'?12:20,order.length));audioStatus='';session={mode,cat,pool,queue,idx:0,answers:[],selected:null,remaining:60,started:Date.now()};page='session';render();if(mode==='sprint'){session.started=Date.now();timer=setInterval(()=>{if(!session||session.mode!=='sprint')return;session.remaining=Math.max(0,60-Math.floor((Date.now()-session.started)/1000));const n=$('#seconds');if(n)n.textContent=session.remaining+'s';if(session.remaining<=0)finish()},250)}}
function cur(){return session?.queue[session.idx]}
function sessionView(){if(!session)return home();let w=cur(),s=session;if(!w)return '<p>Sem questão</p>';let opts=optionsFor(w,s.pool);if(!s.optioncache)s.optioncache={};if(!s.optioncache[s.idx])s.optioncache[s.idx]=opts;opts=s.optioncache[s.idx];const quiz=s.mode!=='sprint';return `<section class="view"><button class="back" type="button" data-action="cancel">← Sair do exercício</button><div class="topline"><span class="eyebrow">${s.mode==='sprint'?'Ear Sprint • 60s':s.cat==='todos'?'Avaliação de escuta':esc(CATS[s.cat].label)}</span><span class="counter">${quiz?`${s.idx+1} / ${s.queue.length}`:`${s.answers.length} respondidas`}</span></div>${quiz?`<div class="progress"><span style="width:${s.idx/s.queue.length*100}%"></span></div>`:`<div class="sprintHeader"><div class="mini">Tempo restante</div><div id="seconds" class="sprintClock">${s.remaining}s</div></div><div class="progress"><span style="width:${s.remaining/60*100}%"></span></div>`}<h1 class="questiontitle">O que você ouviu?</h1><p class="muted" style="font-size:13px">Ouça e escolha a palavra correspondente.</p><div class="earcard"><span class="ear" aria-hidden="true">◉</span><button type="button" class="audioBtn" data-play="${w.id}" aria-label="Reproduzir áudio em japonês">▶</button><div class="repeat">Toque para ouvir • quantas vezes quiser</div><div id="audioState" class="loading" role="status">${esc(audioStatus)}</div></div><div class="options">${opts.map((o,i)=>`<button type="button" class="option" data-answer="${o.id}"><span>${esc(o.text)}</span><span class="mark">${String.fromCharCode(65+i)}</span></button>`).join('')}</div><p class="hints">Sem tradução e sem pistas até o final.</p></section>`}
function answer(id){if(!session||page!=='session')return;let w=cur();if(!w)return;session.answers.push({id:w.id,pick:id,correct:w.id===id,cat:w.cat});stopAudio();session.idx++;if(session.mode==='sprint'){if(session.remaining<=0){finish();return}const recent=session.queue.slice(-3).map(x=>x.id);let opts=shuffle(session.pool.filter(x=>!recent.includes(x.id)));session.queue.push(opts[0]||shuffle(session.pool)[0])}else if(session.idx>=session.queue.length){finish();return}audioStatus='';render()}
function finish(){if(!session)return;if(timer)clearInterval(timer);timer=null;stopAudio();const ans=session.answers;let good=ans.filter(x=>x.correct).length;db.total+=ans.length;db.correct+=good;for(let a of ans){let c=db.cat[a.cat]||{total:0,correct:0};c.total++;if(a.correct)c.correct++;db.cat[a.cat]=c}if(session.mode==='sprint')db.bestSprint=Math.max(db.bestSprint,good);db.attempts.unshift({date:new Date().toISOString(),mode:session.mode,cat:session.cat,total:ans.length,correct:good});db.attempts=db.attempts.slice(0,40);save();session.finished=true;page='results';render();window.scrollTo({top:0,behavior:'instant'})}
function results(){let s=session;if(!s)return progressView();const count=s.answers.length,good=s.answers.filter(a=>a.correct).length;return `<section class="view"><div class="eyebrow">Fim do treino</div><div class="card featured" style="margin-top:15px;text-align:center"><div class="mini">Sua pontuação</div><div class="score">${good}<span style="font-size:25px;color:var(--sub)"> / ${count}</span></div><div style="font-size:14px;margin:8px">${count?Math.round(good/count*100):0}% de acertos</div><p class="muted" style="font-size:13px">${count===0?'Você não respondeu nenhuma questão.':good===count?'Você reconheceu todos os áudios desta rodada.':good/count>=.65?'Bom trabalho. Revise os sons marcados abaixo.':'Reouça especialmente os itens com dificuldade.'}</p></div><div class="btnrow"><button class="btn" data-action="again">↻ Repetir</button><button class="btn ghost" data-navto="home">Início</button></div><div class="sectionbar"><h2>Revisão das respostas</h2><span class="mini">Correção ao final</span></div>${s.answers.length?s.answers.map((a,i)=>{let w=WORDS.find(x=>x.id===a.id),pick=WORDS.find(x=>x.id===a.pick);return `<div class="result ${a.correct?'right':'wrong'}"><div class="resulthead"><span>${a.correct?'✓ Acertou':'✕ Precisa revisar'} · ${i+1}ª questão</span><button class="roundplay" type="button" data-play="${w.id}" aria-label="Ouvir ${esc(w.kana)}">▶ Ouvir</button></div><b>${esc(w.text)} <span style="font-size:12px;color:var(--sub)">${esc(w.kana)}</span></b><div class="meaning">${esc(w.pt)}</div>${a.correct?'':`<div class="meaning" style="color:var(--red);margin-top:6px">Sua resposta: ${esc(pick.text)}</div>`}<div class="meaning" style="margin-top:8px">${esc(w.hint)}</div></div>`}).join(''):'<p class="empty">Nenhuma resposta registrada.</p>'}<div class="info"><span class="icon">ⓘ</span><div>Ouvir a palavra isoladamente não é o mesmo que avaliar o acento tonal. O modo de pitch accent será desenvolvido separadamente, com referências específicas.</div></div></section>`}
function library(){let words=WORDS.filter(w=>`${w.text} ${w.kana} ${w.pt}`.toLowerCase().includes(filteredSearch.toLowerCase())&&(selectedCat==='todos'||w.cat===selectedCat));return `<section class="view"><div class="eyebrow">Biblioteca de pronúncia</div><h1 class="big">Ouça sem pressa.</h1><p class="muted" style="font-size:13px">${WORDS.length} gravações humanas em japonês. A reprodução requer internet.</p><div class="card" style="padding:13px"><input id="search" placeholder="Buscar palavra, leitura ou significado" aria-label="Buscar áudio" value="${esc(filteredSearch)}" style="width:100%;height:44px;padding:0 13px;background:#0f1929;color:#fff;border:1px solid var(--edge);border-radius:12px;outline:none"></div><div class="togglewrap"><button class="toggle ${selectedCat==='todos'?'active':''}" data-cat="todos">Todos</button>${labels()}</div><div id="wordList">${wordListHtml(words)}</div><div id="audioState" role="status" class="notice">${esc(audioStatus)}</div><div class="sectionbar"><h2>Créditos e licenças</h2></div><p class="mini">Áudios: gravações do projeto Lingua Libre por Fukujinzuke, disponíveis no Wikimedia Commons sob CC BY 4.0. Cada gravação tem link para sua página original.</p><p class="mini"><a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" target="_blank" rel="noopener">Licença CC BY 4.0</a> · <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></p></section>`}
function wordListHtml(arr){return arr.map(w=>`<div class="listitem"><div style="min-width:0"><div class="jpn">${esc(w.text)} <span style="font-size:12px;font-weight:500;color:#abc1c9">${esc(w.kana)}</span></div><div class="meaning">${esc(w.pt)}</div><a class="sourceLink" href="${esc(w.source)}" target="_blank" rel="noopener">Fonte ↗</a></div><button type="button" data-play="${w.id}" aria-label="Ouvir ${esc(w.text)}">▶</button></div>`).join('')||'<p class="empty">Nenhuma palavra encontrada.</p>'}
function progressView(){let attempts=db.attempts;let p=db.total?Math.round(db.correct/db.total*100):0;return `<section class="view"><div class="eyebrow">Acompanhamento</div><h1 class="big">Seu progresso.</h1><p class="muted" style="font-size:13px">Dados guardados somente neste navegador. Sem conta e sem servidor.</p><div class="stats"><div class="stat"><strong>${db.total}</strong><span>Respostas</span></div><div class="stat"><strong>${db.total?p+'%':'—'}</strong><span>Taxa de acertos</span></div><div class="stat"><strong>${attempts.length}</strong><span>Sessões recentes</span></div><div class="stat"><strong>${db.bestSprint}</strong><span>Recorde no Sprint</span></div></div><div class="sectionbar"><h2>Precisão por categoria</h2></div><div class="card">${Object.entries(CATS).map(([k,c])=>{let a=db.cat[k]||{correct:0,total:0},pct=a.total?Math.round(100*a.correct/a.total):0;return `<div class="barline"><div class="barline-head"><span>${c.label}</span><span class="muted">${a.total?pct+'%':'Sem dados'} (${a.total})</span></div><div class="bar"><b style="width:${pct}%"></b></div></div>`}).join('')}</div><div class="sectionbar"><h2>Últimas sessões</h2></div>${attempts.length?attempts.slice(0,8).map(a=>`<div class="listitem" style="justify-content:space-between"><div><strong style="font-size:13px">${a.mode==='sprint'?'Sprint 60s':a.cat==='todos'?'Avaliação geral':CATS[a.cat]?.label||'Treino'}</strong><div class="mini">${new Date(a.date).toLocaleDateString('pt-BR')}</div></div><b>${a.correct} / ${a.total}</b></div>`).join(''):'<p class="empty">Conclua seu primeiro treino para ver os resultados.</p>'}<div class="sectionbar"><h2>Seus dados</h2></div><div class="btnrow"><button class="btn ghost" data-action="export">↓ Exportar</button><button class="btn ghost" data-action="clear">Limpar</button></div><p class="footnote">Privacidade: o MimiLab não envia suas respostas a nenhum servidor.</p></section>`}
function sprintInfo(){return `<section class="view"><button class="back" type="button" data-navto="home">← Início</button><div class="eyebrow">Desafio rápido</div><h1 class="big">Ear Sprint ⏱</h1><div class="card featured"><span class="icon" style="font-size:45px">◴</span><h2>60 segundos de escuta</h2><p class="muted">Reconheça o maior número possível de gravações em um minuto. Você pode repetir o áudio, mas o relógio continua correndo.</p><button class="btn" data-action="start-sprint">▶ Começar Sprint</button></div><div class="info"><span class="icon">ⓘ</span><span>O relógio começa imediatamente após tocar em “Começar”. A correção aparece apenas no final. Recomendamos testar um áudio antes.</span></div></section>`}
function render(){if(page==='home')el.innerHTML=home();else if(page==='treino')el.innerHTML=training();else if(page==='biblioteca')el.innerHTML=library();else if(page==='progresso')el.innerHTML=progressView();else if(page==='session')el.innerHTML=sessionView();else if(page==='results')el.innerHTML=results();else if(page==='sprintinfo')el.innerHTML=sprintInfo();}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;let id=t.dataset.play,act=t.dataset.action,nav=t.dataset.navto||t.dataset.nav,cat=t.dataset.cat,one=t.dataset.startCat,ans=t.dataset.answer;if(id){playWord(id);return}if(nav){go(nav);return}if(cat){selectedCat=cat;render();return}if(one){selectedCat=one;begin('quiz',one);return}if(ans){answer(ans);return}if(act==='start-all'){selectedCat='todos';begin('quiz','todos')}if(act==='start-selected')begin('quiz',selectedCat);if(act==='sprint-info'){page='sprintinfo';render()}if(act==='start-sprint')begin('sprint','todos');if(act==='cancel'){if(confirm('Deseja abandonar este treino? As respostas desta rodada não serão salvas.'))go('home')}if(act==='again'){const{mode,cat}=session;begin(mode,cat)}if(act==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='mimilab-progresso.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}if(act==='clear'){if(confirm('Apagar todo o progresso salvo neste aparelho?')){db={total:0,correct:0,attempts:[],cat:{},bestSprint:0,settings:{}};save();render()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filteredSearch=e.target.value;const matching=WORDS.filter(w=>`${w.text} ${w.kana} ${w.pt}`.toLowerCase().includes(filteredSearch.toLowerCase())&&(selectedCat==='todos'||w.cat===selectedCat));$('#wordList').innerHTML=wordListHtml(matching)}});
$('#soundTop').addEventListener('click',()=>{go('biblioteca');playWord('takai')});
window.addEventListener('pagehide',()=>{stopAudio();if(timer)clearInterval(timer)});
render();
</script>
